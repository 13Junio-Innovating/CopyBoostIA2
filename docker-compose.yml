services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
  api:
    build:
      context: ./backend
    environment:
      PORT: "3001"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1"
    ports:
      - "3001:3001"
    depends_on:
      - ollama

volumes:
  ollama:
